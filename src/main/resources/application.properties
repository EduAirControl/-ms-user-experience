spring.application.name=ms-user-experience

# Puerto canonico segun 09-microservices/service-catalog.md
server.port=${SERVER_PORT:3006}

# ADR-003: una instancia PostgreSQL compartida y un esquema propio por servicio.
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/eduaircontrol}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.contexts=${DB_CHANGELOG_CONTEXTS:}

# Seguridad: mismo JWT que el resto de servicios; el gateway tambien lo valida.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

server.error.include-message=always
